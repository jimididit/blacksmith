name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

jobs:
  # Hard gate: trust-boundary regressions (must pass for merge)
  trust-gate:
    name: Trust Boundary Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Forbid shell=True in package_managers
        run: |
          if grep -RInE 'shell\s*=\s*True' blacksmith/package_managers/; then
            echo "::error::shell=True is forbidden in blacksmith/package_managers/"
            exit 1
          fi
          echo "OK: no shell=True in package_managers"

      - name: Trust-boundary unit tests
        run: pytest tests/test_identifiers.py tests/test_trust_boundary.py -v

  # Advisory code quality (not required by CI aggregator while lint debt is cleared)
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy yamllint

      - name: Run Ruff (linter)
        continue-on-error: true
        run: ruff check blacksmith/

      - name: Run Ruff (formatter check)
        continue-on-error: true
        run: ruff format --check blacksmith/

      - name: Type checking with mypy
        continue-on-error: true
        run: mypy blacksmith/ --ignore-missing-imports

      - name: Check YAML syntax
        continue-on-error: true
        run: |
          yamllint blacksmith/sets/minimal.yaml \
            blacksmith/sets/development.yaml \
            blacksmith/sets/cybersecurity.yaml || true

  # Unit Tests — hard fail
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run tests
        run: pytest tests/ -v --cov=blacksmith --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false

  # Integration Tests — hard fail on smoke CLI
  integration-test:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Blacksmith
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Test CLI commands (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          blacksmith --version
          blacksmith --help
          blacksmith list
          blacksmith search git --limit 5 || echo "Search skipped (no package manager)"

      - name: Test CLI commands (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          blacksmith --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          blacksmith --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          blacksmith list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          blacksmith search git --limit 5
          if ($LASTEXITCODE -ne 0) { Write-Host "Search skipped (no package manager)" }

  # Security Scanning — hard fail on known vulnerable deps
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: pip-audit locked dependencies
        run: pip-audit -r requirements.lock

      - name: Bandit (medium+ severity)
        run: |
          pip install -r requirements.lock
          bandit -r blacksmith/ -ll

  # Build Package
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [trust-gate, test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build twine packaging
          pip install --upgrade "setuptools>=77.0.0"

      - name: Clean previous builds
        run: |
          rm -rf dist/ build/ *.egg-info
          find . -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true

      - name: Verify pyproject.toml configuration
        run: |
          echo "Checking pyproject.toml configuration..."
          grep -q 'setuptools>=77.0.0' pyproject.toml || (echo "ERROR: setuptools version not >=77.0.0" && exit 1)
          grep -q 'license-files = \["LICENSE"\]' pyproject.toml || (echo "ERROR: license-files not set to [\"LICENSE\"]" && exit 1)
          echo "✓ pyproject.toml configuration looks correct"

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Inspect package metadata
        run: |
          echo "Inspecting package metadata..."
          python -m zipfile -l dist/*.whl | grep -E "(METADATA|LICENSE)" || true
          unzip -q -o dist/*.whl -d /tmp/package-inspect 2>/dev/null || true
          if [ -f /tmp/package-inspect/*.dist-info/METADATA ]; then
            echo "=== METADATA contents ==="
            cat /tmp/package-inspect/*.dist-info/METADATA | grep -E "(License|license)" || echo "No license fields found in METADATA"
            echo "=== Checking for License-Expression ==="
            if ! grep -q "^License-Expression: Apache-2.0" /tmp/package-inspect/*.dist-info/METADATA; then
              echo "ERROR: License-Expression not found or incorrect in METADATA!"
              exit 1
            fi
            if ! grep -q "^License-File: LICENSE" /tmp/package-inspect/*.dist-info/METADATA; then
              echo "ERROR: License-File not found or incorrect in METADATA!"
              exit 1
            fi
            echo "✓ License metadata fields are correct"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Single required status check for branch protection
  ci:
    name: CI
    if: always()
    needs: [trust-gate, test, integration-test, security, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require all gating jobs to succeed
        run: |
          echo "trust-gate=${{ needs.trust-gate.result }}"
          echo "test=${{ needs.test.result }}"
          echo "integration-test=${{ needs.integration-test.result }}"
          echo "security=${{ needs.security.result }}"
          echo "build=${{ needs.build.result }}"
          if [ "${{ needs.trust-gate.result }}" != "success" ] \
            || [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.integration-test.result }}" != "success" ] \
            || [ "${{ needs.security.result }}" != "success" ] \
            || [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::One or more required CI jobs failed"
            exit 1
          fi
          echo "All required CI jobs passed"

  # Release (tags only; requires green build from this workflow run)
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, ci]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install --upgrade twine packaging > /dev/null 2>&1
          twine check dist/*
          twine upload dist/* --skip-existing

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check for release notes file
        id: check_notes
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          NOTES_FILE="release-notes/v${VERSION}.md"

          if [ -f "$NOTES_FILE" ]; then
            echo "Found release notes file: $NOTES_FILE"
            echo "notes_file=$NOTES_FILE" >> $GITHUB_OUTPUT
            echo "use_custom=true" >> $GITHUB_OUTPUT
          else
            echo "Release notes file not found: $NOTES_FILE"
            echo "Will use GitHub auto-generated release notes"
            echo "use_custom=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes (if custom not found)
        if: steps.check_notes.outputs.use_custom == 'false'
        id: generate_notes
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              target_commitish: context.sha,
            });
            core.setOutput('body', data.body)

      - name: Create GitHub Release (with custom notes)
        if: steps.check_notes.outputs.use_custom == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Blacksmith ${{ github.ref_name }}
          body_path: ${{ steps.check_notes.outputs.notes_file }}
          files: dist/*
          draft: false
          prerelease: false

      - name: Create GitHub Release (with generated notes)
        if: steps.check_notes.outputs.use_custom == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Blacksmith ${{ github.ref_name }}
          body: ${{ steps.generate_notes.outputs.body }}
          files: dist/*
          draft: false
          prerelease: false
